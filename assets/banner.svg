<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#080c14"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="orbGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".5"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient><linearGradient id="orbGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".4"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#374151" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity=".3"/></pattern><style>@keyframes float1{0%{transform:translate(0,0) scale(1)}}@keyframes float2{0%{transform:translate(0,0) scale(1.1)}}@keyframes pulse{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes beamMove{0%{transform:translateX(-200px)}}.title-text{font-weight:800;font-size:46px;letter-spacing:-.5px}.pill-text,.subtitle-text,.tagline-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;font-size:20px;fill:#94a3b8}.pill-text,.tagline-text{font-weight:600}.tagline-text{font-size:14px;fill:#38bdf8;letter-spacing:2px;text-transform:uppercase}.pill-text{font-size:13px;fill:#f1f5f9}.float-orb1{animation:float1 10s ease-in-out infinite alternate}.float-orb2{animation:float2 12s ease-in-out infinite alternate}.beam-slide{animation:beamMove 6s linear infinite}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g class="float-orb1"><circle cx="200" cy="120" r="160" fill="url(#orbGrad1)" filter="url(#glow)"/></g><g class="float-orb2"><circle cx="1020" cy="280" r="180" fill="url(#orbGrad2)" filter="url(#glow)"/></g><g opacity=".35"><path fill="none" stroke="#6366f1" stroke-dasharray="6 6" stroke-width="2" d="M 50 350 L 300 350 L 400 390 L 800 390 L 900 330 L 1150 330"/><path fill="none" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="2" d="M 100 70 L 350 70 L 450 30 L 750 30 L 850 80 L 1100 80"/><circle cx="400" cy="390" r="4" fill="#ec4899"/><circle cx="800" cy="390" r="4" fill="#38bdf8"/><circle cx="450" cy="30" r="4" fill="#a855f7"/><circle cx="750" cy="30" r="4" fill="#38bdf8"/></g><g opacity=".4"><line x1="0" x2="1200" y1="210" y2="210" stroke="#1e293b" stroke-width="1"/><g class="beam-slide"><circle cx="0" cy="210" r="3" fill="#38bdf8" filter="url(#softGlow)"/><line x1="-120" x2="0" y1="210" y2="210" stroke="url(#accentGrad)" stroke-width="2"/></g></g><rect width="1040" height="330" x="80" y="45" fill="#0f172a" fill-opacity=".75" stroke="#334155" stroke-width="1.5" rx="20"/><g transform="translate(130, 95)"><rect width="310" height="28" x="0" y="0" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" rx="14"/><circle cx="14" cy="14" r="5" fill="#38bdf8"/><text x="28" y="19" class="tagline-text">Curated Ecosystem Guide</text></g><g><text x="0" y="0" fill="url(#accentGrad)" class="title-text" transform="translate(130, 165)">Creative Cloud Application Manager</text><text x="0" y="42" class="subtitle-t