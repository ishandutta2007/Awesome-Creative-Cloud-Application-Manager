<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#374151" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#6366f1" fill-opacity="0.3" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
      }
      .tagline-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #38bdf8;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .pill-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f1f5f9;
      }
      .float-orb1 {
        animation: float1 10s ease-in-out infinite alternate;
      }
      .float-orb2 {
        animation: float2 12s ease-in-out infinite alternate;
      }
      .pulse-ring {
        animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .beam-slide {
        animation: beamMove 6s linear infinite;
      }
      @keyframes float1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes float2 {
        0% { transform: translate(0px, 0px) scale(1.1); }
        100% { transform: translate(-50px, -30px) scale(0.9); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes beamMove {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(1400px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="float-orb1">
    <circle cx="200" cy="120" r="160" fill="url(#orbGrad1)" filter="url(#glow)" />
  </g>
  <g class="float-orb2">
    <circle cx="1020" cy="280" r="180" fill="url(#orbGrad2)" filter="url(#glow)" />
  </g>

  <!-- Dynamic Circuit Lines and Nodes in Background -->
  <g opacity="0.35">
    <path d="M 50 350 L 300 350 L 400 390 L 800 390 L 900 330 L 1150 330" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="6 6" />
    <path d="M 100 70 L 350 70 L 450 30 L 750 30 L 850 80 L 1100 80" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="400" cy="390" r="4" fill="#ec4899" />
    <circle cx="800" cy="390" r="4" fill="#38bdf8" />
    <circle cx="450" cy="30" r="4" fill="#a855f7" />
    <circle cx="750" cy="30" r="4" fill="#38bdf8" />
  </g>

  <!-- Animated Laser Beam line across the canvas -->
  <g opacity="0.4">
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#1e293b" stroke-width="1" />
    <g class="beam-slide">
      <circle cx="0" cy="210" r="3" fill="#38bdf8" filter="url(#softGlow)" />
      <line x1="-120" y1="210" x2="0" y2="210" stroke="url(#accentGrad)" stroke-width="2" />
    </g>
  </g>

  <!-- Central Glass Card (Behind Foregrounds) -->
  <rect x="80" y="45" width="1040" height="330" rx="20" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />

  <!-- Foreground Content: Header Tagline -->
  <g transform="translate(130, 95)">
    <!-- Small Tagline Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#38bdf8" />
    <text x="28" y="19" class="tagline-text">Curated Ecosystem Guide</text>
  </g>

  <!-- Title & Subtitle in Foreground -->
  <g transform="translate(130, 165)">
    <text x="0" y="0" class="title-text" fill="url(#accentGrad)">
      Creative Cloud Application Manager
    </text>
    <text x="0" y="42" class="subtitle-text">
      Self-Service Portals • Endpoint App Management • Software Distribution Pipelines
    </text>
  </g>

  <!-- Feature Pills / Badges in Foreground -->
  <g transform="translate(130, 260)">
    <!-- Pill 1: macOS & Windows -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="170" height="42" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
      <text x="18" y="26" class="pill-text">⚡ Multi-OS Fleets</text>
    </g>

    <!-- Pill 2: Self-Service Portals -->
    <g transform="translate(185, 0)">
      <rect x="0" y="0" width="190" height="42" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="18" y="26" class="pill-text">📦 Self-Service Portals</text>
    </g>

    <!-- Pill 3: Enterprise & BYOC -->
    <g transform="translate(390, 0)">
      <rect x="0" y="0" width="220" height="42" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
      <text x="18" y="26" class="pill-text">🛡️ Zero-Trust Deployment</text>
    </g>

    <!-- Pill 4: Open Source & SaaS -->
    <g transform="translate(625, 0)">
      <rect x="0" y="0" width="200" height="42" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
      <text x="18" y="26" class="pill-text">🌐 SaaS &amp; Open-Source</text>
    </g>

    <!-- Pill 5: Package Management -->
    <g transform="translate(840, 0)">
      <rect x="0" y="0" width="100" height="42" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
      <text x="18" y="26" class="pill-text">🚀 Fast</text>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="80" y="372" width="1040" height="3" rx="1.5" fill="url(#accentGrad)" />
</svg>
